[project]
name = "threatledger"
version = "0.1.0"
description = "Open-source, threat-informed GRC platform linking risks to MITRE ATT&CK, controls and compliance frameworks."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "django-q2>=1.7",
    "redis>=5.0",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "django-environ>=0.11",
    "whitenoise>=6.7",
    "django-htmx>=1.19",
    "argon2-cffi>=23.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "drf-spectacular>=0.30",
    "django-csp>=4.0,<5",
    "django-axes>=9.0,<10",
    "django-otp>=1.7",
    "qrcode>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs>=3.15",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "playwright==1.64.1",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF", "PT"]
ignore = [
    "RUF012",  # Django class attributes (Meta, fields) are intentionally mutable
    "RUF001", "RUF002", "RUF003",  # UI copy deliberately uses typographic × – → characters
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "E501", "PT018"]
"tests/**" = ["S101", "S105", "S106", "E501", "PT018"]
"conftest.py" = ["S105"]
"scripts/seeds/*.py" = ["E501", "S101"]  # data scripts: long literals, sanity asserts

[tool.ruff.lint.isort]
known-first-party = ["threatledger", "config"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["/migrations/", "^scripts/seeds/"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["threatledger", "tests"]
addopts = "-ra --strict-markers"
markers = ["postgres: requires a PostgreSQL database (skipped on SQLite)"]

[tool.coverage.run]
branch = true
source = ["threatledger"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
