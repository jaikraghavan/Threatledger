name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run mypy .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: threatledger
          POSTGRES_USER: threatledger
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threatledger" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://threatledger:ci-only-throwaway@localhost:5432/threatledger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests on PostgreSQL with coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Tests on SQLite (local-dev parity)
        run: uv run pytest -q
        env:
          DATABASE_URL: ""
      - name: Production settings pass deploy checks
        run: |
          set +e
          uv run python manage.py check --deploy --fail-level WARNING > deploy-check.txt 2>&1
          status=$?
          cat deploy-check.txt
          if [ $status -ne 0 ]; then
            grep -E "^\?:|^[a-z_.]+: \(|W[0-9]{3}|E[0-9]{3}|Error" deploy-check.txt | head -20 | while IFS= read -r line; do echo "::error title=check --deploy::${line}"; done
          fi
          exit $status
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: threatledger.example
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-deploy-check-key-not-used-anywhere
      - name: Production collectstatic (manifest storage resolves every reference)
        run: |
          mkdir -p static/css && touch static/css/app.css
          uv run python manage.py collectstatic --noinput -v0
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: threatledger.example
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-deploy-check-key-not-used-anywhere
          STATIC_ROOT: /tmp/staticfiles

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Bandit (static analysis)
        run: uv run bandit -c pyproject.toml -r threatledger config
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --progress-spinner off

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: threatledger:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: test "$(docker image inspect threatledger:local --format '{{.Config.User}}')" = "10001:10001"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: threatledger:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test - docker compose up on a clean host
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl -fsk --resolve localhost:443:127.0.0.1 https://localhost/healthz; then break; fi
            sleep 3
          done
          curl -fsk https://localhost/readyz
          curl -fsk -o /dev/null -w "%{http_code}\n" https://localhost/accounts/login/ | grep -q 200
          docker compose exec -T web python manage.py check --deploy --fail-level WARNING
          docker compose exec -T web python manage.py audit_verify
      - name: Smoke test - real ATT&CK import inside the stack (twice, must be idempotent)
        run: |
          docker compose exec -T web python manage.py import_attack --version 20.1
          docker compose exec -T web python manage.py import_attack --version 20.1 | tee second.txt
          grep -q "0 created, 0 updated" second.txt
          docker compose exec -T web python manage.py shell -c "
          from threatledger.attack.models import Technique, Tactic
          from django.db import connection
          assert Technique.objects.active().count() > 600, 'too few techniques'
          assert Tactic.objects.exclude(order=None).count() >= 14, 'tactics missing'
          with connection.cursor() as c:
              c.execute(\"select count(*) from pg_indexes where indexname like 'attack_%_trgm'\")
              assert c.fetchone()[0] == 3, 'trigram indexes missing'
          print('ATT&CK smoke OK')"
          docker compose exec -T web python manage.py seed --allow-production
          docker compose exec -T web python manage.py seed_controls | tee controls.txt
          grep -q "Created 14" controls.txt
          if grep -q "not found" controls.txt; then echo "starter mappings reference missing ATT&CK IDs"; exit 1; fi
      - name: Smoke test - frameworks, CTID mappings and compliance inside the stack
        run: |
          docker compose exec -T web python manage.py seed_frameworks | tee fw.txt
          grep -q "Starter control → requirement mappings created: 146" fw.txt
          docker compose exec -T web python manage.py import_ctid_mappings | tee ctid.txt
          grep -q "0 unknown control" ctid.txt
          docker compose exec -T web python manage.py shell -c "
          from threatledger.frameworks.models import Framework
          from threatledger.frameworks.services import framework_result
          from threatledger.controls.models import Control
          from threatledger.org.models import Organisation
          org = Organisation.objects.current()
          fw = Framework.objects.get(code='HIPAA-SR')
          before = framework_result(fw, org).summary.percent
          Control.objects.filter(ref='CTL-BACKUP').update(status='implemented')
          after = framework_result(fw, org).summary.percent
          assert after > before, (before, after)
          print('compliance smoke OK', before, '->', after)"
          docker compose exec -T web python manage.py audit_verify
      - name: Smoke test - snapshots, dashboard, coverage matrix and Navigator export
        run: |
          docker compose exec -T web python manage.py take_snapshots
          docker compose exec -T web python manage.py shell -c "
          import json
          from django.test import Client
          from threatledger.accounts.models import User
          c = Client(HTTP_HOST='localhost', HTTP_X_FORWARDED_PROTO='https')
          c.force_login(User.objects.get(username='auditor'))
          for url in ['/', '/coverage/?scope=all', '/coverage/?scope=sector&value=financial', '/reports/board/']:
              r = c.get(url, secure=True)
              assert r.status_code == 200, (url, r.status_code)
          layer = json.loads(c.get('/coverage/navigator.json?scope=all', secure=True).content)
          assert layer['versions']['layer'] == '4.5' and len(layer['techniques']) > 600, len(layer['techniques'])
          print('reporting smoke OK')"
      - name: Smoke test - security headers through Caddy, API token, demo data
        run: |
          headers=$(curl -fsk -D - -o /dev/null https://localhost/accounts/login/)
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy: .*script-src 'self'"
          if echo "$headers" | grep -qi "unsafe-inline"; then echo "CSP allows unsafe-inline"; exit 1; fi
          echo "$headers" | grep -qi "^strict-transport-security: max-age="
          echo "$headers" | grep -qi "^x-frame-options: DENY"
          docker compose exec -T web python manage.py seed_demo --allow-production | tee demo.txt
          grep -q "Demo data loaded" demo.txt
          token=$(docker compose exec -T web python manage.py shell -c "
          from threatledger.accounts.models import User
          from threatledger.api.models import ApiToken
          print(ApiToken.issue(User.objects.get(username='auditor'), 'ci', 1)[1])" | tail -1)
          test "$(curl -fsk -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $token" https://localhost/api/v1/risks/)" = 200
          test "$(curl -sk -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer tl_00000000_invalidinvalidinvalid' https://localhost/api/v1/risks/)" = 401
          curl -fsk -H "Authorization: Bearer $token" "https://localhost/api/v1/frameworks/" | grep -q NIST-800-53-R5
      - name: Smoke test - PostgreSQL backup and restore round trip
        run: |
          docker compose exec -T web python manage.py backup | tee backup.txt
          archive=$(grep -o '/srv/backups/threatledger-backup-[0-9TZ]*\.tar\.gz' backup.txt)
          docker compose exec -T web python manage.py verify_backup "$archive"
          before=$(docker compose exec -T web python manage.py shell -c "from threatledger.risks.models import Risk; print(Risk.objects.count())" | tail -1)
          docker compose exec -T web python manage.py shell -c "from threatledger.risks.models import Risk; Risk.objects.filter(title__startswith='Ransomware').update(title='tampered after backup')"
          docker compose exec -T web python manage.py restore "$archive" --force
          after=$(docker compose exec -T web python manage.py shell -c "from threatledger.risks.models import Risk; print(Risk.objects.count(), Risk.objects.filter(title='tampered after backup').count())" | tail -1)
          test "$after" = "$before 0"
          docker compose exec -T web python manage.py audit_verify
      - name: Performance check - 1,000 risks with full ATT&CK loaded
        run: |
          set +e
          docker compose exec -T web python manage.py perf_check --risks 1000 --max-ms 2000 > perf.txt 2>&1
          status=$?
          cat perf.txt
          if [ $status -ne 0 ]; then
            grep -vE '"level": "(INFO|DEBUG)"' perf.txt | tail -25 | while IFS= read -r line; do echo "::error title=perf_check (exit $status)::${line}"; done
          fi
          exit $status
          docker compose exec -T web python manage.py audit_verify
      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color
          # Also surface a short per-service tail as annotations (visible on the run summary).
          for svc in init db redis web worker caddy; do
            tail_text=$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' "$svc" 2>&1; docker compose logs --no-color --no-log-prefix --tail 12 "$svc" 2>&1)
            tail_text="${tail_text//'%'/'%25'}"; tail_text="${tail_text//$'\n'/'%0A'}"
            echo "::error title=compose ${svc}::${tail_text}"
          done
      - name: Tear down
        if: always()
        run: docker compose down -v
