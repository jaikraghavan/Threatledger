name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_FROZEN: "1"
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run ruff check . --output-format=github
      - run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - run: uv run mypy .

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: threatledger
          POSTGRES_USER: threatledger
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U threatledger" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://threatledger:ci-only-throwaway@localhost:5432/threatledger
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests on PostgreSQL with coverage gate
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Tests on SQLite (local-dev parity)
        run: uv run pytest -q
        env:
          DATABASE_URL: ""
      - name: Production settings pass deploy checks
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: threatledger.example
          DJANGO_SECRET_KEY: ${{ github.run_id }}-${{ github.run_attempt }}-ci-only-deploy-check-key-not-used-anywhere

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync
      - name: Bandit (static analysis)
        run: uv run bandit -c pyproject.toml -r threatledger config
      - name: pip-audit (runtime dependencies)
        run: |
          uv export --no-dev --no-hashes --format requirements-txt -o requirements-audit.txt
          uv run pip-audit -r requirements-audit.txt --progress-spinner off

  docker:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          load: true
          tags: threatledger:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root
        run: test "$(docker image inspect threatledger:local --format '{{.Config.User}}')" = "10001:10001"
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: threatledger:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test - docker compose up on a clean host
        run: |
          docker compose up -d --no-build
          for i in $(seq 1 60); do
            if curl -fsk --resolve localhost:443:127.0.0.1 https://localhost/healthz; then break; fi
            sleep 3
          done
          curl -fsk https://localhost/readyz
          curl -fsk -o /dev/null -w "%{http_code}\n" https://localhost/accounts/login/ | grep -q 200
          docker compose exec -T web python manage.py check --deploy --fail-level WARNING
          docker compose exec -T web python manage.py audit_verify
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
