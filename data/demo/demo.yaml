# Starter controls: status, effectiveness, owner, days since last test (null = never), result
controls:
  CTL-MFA:      [implemented,     4, controlowner, 60,  pass]
  CTL-EDR:      [implemented,     4, controlowner, 120, pass]
  CTL-PATCH:    [partial,         3, controlowner, 200, partial]
  CTL-PAM:      [partial,         2, riskmanager,  400, fail]
  CTL-BACKUP:   [implemented,     3, controlowner, 90,  pass]
  CTL-SIEM:     [partial,         3, controlowner, 30,  partial]
  CTL-SEGMENT:  [planned,         null, riskmanager, null, null]
  CTL-EMAIL:    [implemented,     4, controlowner, 45,  pass]
  CTL-AWARE:    [implemented,     3, riskmanager,  150, pass]
  CTL-IR:       [partial,         2, riskmanager,  500, fail]
  CTL-VENDOR:   [planned,         null, riskmanager, null, null]
  CTL-HARDEN:   [partial,         3, controlowner, 300, partial]
  CTL-DLP:      [not_implemented, null, null,      null, null]
  CTL-PASSWORD: [implemented,     4, controlowner, 100, pass]

evidence:
  # control, title, url, valid for (days from today; negative = expired)
  - [CTL-MFA, Conditional access policy export, https://wiki.halcyon.example/sec/mfa-policy, 300]
  - [CTL-EDR, EDR deployment coverage report, https://wiki.halcyon.example/sec/edr-coverage, 20]
  - [CTL-BACKUP, Quarterly restore test record, https://tickets.halcyon.example/OPS-4411, 60]
  - [CTL-EMAIL, DMARC aggregate report (p=reject), https://wiki.halcyon.example/sec/dmarc, 180]
  - [CTL-AWARE, Phishing simulation results Q3, https://wiki.halcyon.example/sec/phish-q3, -5]
  - [CTL-PATCH, Vulnerability SLA dashboard, https://grafana.halcyon.example/d/vuln-sla, 25]

risks:
  # title, category, business unit, owner, inherent [L,I], residual [L,I], treatment, status,
  # target (days), next review (days), assets, techniques, controls, scenario
  - title: Ransomware encrypts warehouse and finance systems
    category: cyber
    bu: Operations
    owner: riskmanager
    inherent: [4, 5]
    residual: [3, 5]
    treatment: mitigate
    status: in_treatment
    target: 120
    review: 30
    assets: [Warehouse management system, File servers, ERP (finance & procurement), Backup vault]
    techniques: [T1566.001, T1204.002, T1059.001, T1021.001, T1486, T1490]
    controls: [CTL-EDR, CTL-BACKUP, CTL-EMAIL, CTL-SEGMENT, CTL-IR]
    scenario: >-
      A criminal affiliate phishes a warehouse supervisor, runs a PowerShell loader, moves
      laterally over RDP and encrypts the WMS and file servers, deleting shadow copies. Picking
      stops at three distribution centres for several days; contractual SLA penalties apply.
  - title: Business email compromise diverts supplier payments
    category: fraud
    bu: Finance
    owner: riskmanager
    inherent: [4, 4]
    residual: [2, 4]
    treatment: mitigate
    status: in_treatment
    target: 60
    review: 45
    assets: [Microsoft 365 tenant, Accounts payable process, Finance team]
    techniques: [T1566.002, T1078.004, T1114.003, T1534]
    controls: [CTL-MFA, CTL-EMAIL, CTL-AWARE]
    scenario: >-
      An attacker phishes an accounts-payable clerk's Microsoft 365 credentials, adds a mailbox
      forwarding rule and impersonates a freight carrier to change bank details. A single
      fraudulent payment run could exceed £400k.
  - title: Credential stuffing takes over customer accounts
    category: cyber
    bu: Engineering
    owner: riskmanager
    inherent: [5, 3]
    residual: [3, 3]
    treatment: mitigate
    status: open
    target: 90
    review: 60
    assets: [Customer portal (halcyon.example), Customer database (PostgreSQL)]
    techniques: [T1110.004, T1078]
    controls: [CTL-MFA, CTL-PASSWORD]
    scenario: >-
      Botnets replay breached username/password pairs against the customer portal, redirecting
      deliveries and harvesting addresses. Customer MFA is optional, so residual likelihood stays
      material.
  - title: Exploitation of an internet-facing application vulnerability
    category: cyber
    bu: Engineering
    owner: riskmanager
    inherent: [4, 5]
    residual: [3, 4]
    treatment: mitigate
    status: in_treatment
    target: 45
    review: -10
    assets: [Customer portal (halcyon.example), Shipment tracking API, Kubernetes cluster (prod)]
    techniques: [T1190, T1505.003, T1059.004]
    controls: [CTL-PATCH, CTL-HARDEN, CTL-SIEM]
    scenario: >-
      A public exploit for a framework used by the tracking API is weaponised within days of
      disclosure. Patching of internet-facing services currently runs behind the 14-day SLA.
  - title: Personal data breach from misconfigured cloud storage
    category: data_privacy
    bu: Engineering
    owner: riskmanager
    inherent: [3, 5]
    residual: [2, 4]
    treatment: mitigate
    status: open
    target: 90
    review: 30
    assets: [AWS data lake, AWS production account]
    techniques: [T1530, T1537]
    controls: [CTL-HARDEN, CTL-DLP, CTL-SIEM]
    scenario: >-
      A data-lake bucket holding customer addresses is made public during a migration. Exposure
      of UK, EU and Indian personal data triggers GDPR and DPDP Act breach notification duties.
  - title: Compromise of a managed service provider
    category: third_party
    bu: Corporate
    owner: riskmanager
    inherent: [3, 5]
    residual: [3, 4]
    treatment: mitigate
    status: open
    target: 180
    review: 90
    assets: [Managed service provider (IT support), Domain controllers]
    techniques: [T1199, T1078, T1219]
    controls: [CTL-VENDOR, CTL-PAM, CTL-MFA]
    scenario: >-
      The MSP's remote management tooling is hijacked and used to push malware to Halcyon
      endpoints with standing domain-admin credentials.
  - title: Software supply chain compromise via a dependency
    category: third_party
    bu: Engineering
    owner: riskmanager
    inherent: [3, 4]
    residual: [2, 4]
    treatment: mitigate
    status: open
    target: 150
    review: 120
    assets: [CI/CD pipeline, Source code repositories, Container registry]
    techniques: [T1195.001, T1195.002]
    controls: [CTL-VENDOR, CTL-HARDEN]
    scenario: >-
      A typosquatted package or a compromised maintainer account injects malicious code into a
      build, which is then deployed to production and the driver app.
  - title: Privileged account misuse by an insider
    category: people
    bu: Corporate
    owner: riskmanager
    inherent: [2, 5]
    residual: [2, 4]
    treatment: mitigate
    status: in_treatment
    target: 90
    review: 30
    assets: [Privileged administrators, Domain controllers, AWS production account]
    techniques: [T1078.002, T1098, T1136.002]
    controls: [CTL-PAM, CTL-SIEM]
    scenario: >-
      A disgruntled administrator with standing privileges creates a backdoor account before
      leaving. PAM is only partly rolled out and the last access review failed.
  - title: Theft of credentials from endpoints
    category: cyber
    bu: Corporate
    owner: controlowner
    inherent: [3, 4]
    residual: [2, 3]
    treatment: mitigate
    status: open
    target: 120
    review: 60
    assets: ["Corporate laptops (~1,200)", Domain controllers]
    techniques: [T1003.001, T1555.003, T1552.001]
    controls: [CTL-EDR, CTL-HARDEN, CTL-PAM]
    scenario: >-
      Infostealer malware dumps LSASS and browser-stored passwords, giving attackers VPN and SaaS
      access.
  - title: Exfiltration of customer data to cloud storage
    category: data_privacy
    bu: Customer Services
    owner: riskmanager
    inherent: [3, 4]
    residual: [3, 4]
    treatment: mitigate
    status: open
    target: 200
    review: 60
    assets: [CRM, Customer support ticketing, Customer database (PostgreSQL)]
    techniques: [T1567.002, T1048, T1213]
    controls: [CTL-DLP, CTL-SIEM]
    scenario: >-
      An attacker or departing agent exports CRM records and uploads them to personal cloud
      storage. No DLP is in place yet.
  - title: DDoS takes the customer portal and tracking API offline
    category: operational
    bu: Engineering
    owner: riskmanager
    inherent: [3, 3]
    residual: [2, 3]
    treatment: transfer
    status: open
    target: null
    review: 180
    assets: [Customer portal (halcyon.example), Shipment tracking API]
    techniques: [T1498, T1499]
    controls: [CTL-SEGMENT]
    scenario: >-
      A volumetric attack during peak season degrades tracking for retailers. CDN DDoS protection
      and cyber insurance transfer most of the impact.
  - title: Destructive wiper attack on backups
    category: cyber
    bu: Engineering
    owner: riskmanager
    inherent: [2, 5]
    residual: [1, 5]
    treatment: mitigate
    status: open
    target: null
    review: 90
    assets: [Backup vault, AWS production account]
    techniques: [T1485, T1490, T1078.004]
    controls: [CTL-BACKUP, CTL-MFA, CTL-PAM]
    scenario: >-
      Attackers who reach the cloud console delete snapshots and backups before deploying a
      wiper. Immutable, separately administered backups limit the residual risk.
  - title: Phishing of delivery drivers' mobile accounts
    category: cyber
    bu: Operations
    owner: controlowner
    inherent: [4, 2]
    residual: [3, 2]
    treatment: accept
    status: accepted
    target: null
    review: 120
    assets: [Driver smartphones, Delivery driver mobile app]
    techniques: [T1566.002, T1078]
    controls: [CTL-AWARE]
    scenario: >-
      SMS phishing harvests driver app logins to view route manifests. Impact is limited because
      the app exposes only the current day's drops.
    acceptance: [approved, "Low impact; the app shows one day's route only; revisit when MDM rollout completes.", 150]
  - title: Legacy warehouse OT cannot be patched
    category: operational
    bu: Operations
    owner: riskmanager
    inherent: [3, 4]
    residual: [3, 3]
    treatment: accept
    status: accepted
    target: null
    review: 60
    assets: ["Warehouse OT (conveyors, sorters)", Warehouse Wi-Fi]
