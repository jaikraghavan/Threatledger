  - title: Session token theft bypasses MFA
    category: cyber
    bu: Corporate
    owner: riskmanager
    inherent: [3, 4]
    residual: [3, 3]
    treatment: mitigate
    status: open
    target: 120
    review: 45
    assets: [Microsoft 365 tenant, Identity provider (SSO)]
