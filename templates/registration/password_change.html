{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="max-w-md">
  <h1 class="mb-4 text-xl font-semibold">Change password</h1>
  <form method="post" class="card space-y-4 p-6">{% csrf_token %}
    {% for field in form %}
      <div><label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input class="field" type="password" name="{{ field.html_name }}" id="{{ field.id_for_label }}" autocomplete="{% if field.name == 'old_password' %}current-password{% else %}new-password{% endif %}" required>
        {% for e in field.errors %}<p class="mt-1 text-sm text-red-700">{{ e }}</p>{% endfor %}
        {% if field.help_text %}<div class="mt-1 text-xs text-slate-500">{{ field.help_text|safe }}</div>{% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary">Change password</button>
  </form>
</div>
{% endblock %}
