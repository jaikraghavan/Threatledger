{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block anon_content %}
<div class="w-full max-w-sm">
  <div class="mb-6 flex items-center justify-center gap-2 text-xl font-semibold"><span class="inline-block h-7 w-7 rounded bg-brand-500" aria-hidden="true"></span> ThreatLedger</div>
  <form method="post" class="card space-y-4 p-6" novalidate>
    {% csrf_token %}
    <h1 class="text-lg font-semibold">Sign in</h1>
    {% if form.non_field_errors %}<div class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-800" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
    <div><label class="label" for="id_username">Username</label><input class="field" type="text" name="username" id="id_username" autocomplete="username" autofocus required value="{{ form.username.value|default:'' }}"></div>
    <div><label class="label" for="id_password">Password</label><input class="field" type="password" name="password" id="id_password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="btn btn-primary w-full justify-center">Sign in</button>
  </form>
</div>
{% endblock %}
