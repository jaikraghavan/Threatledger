{% extends "base.html" %}
{% block title %}Two-factor verification{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm">
  <form method="post" class="card space-y-4 p-6">{% csrf_token %}
    <h1 class="text-lg font-semibold">Two-factor verification</h1>
    <p class="text-sm text-slate-600">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
    {% include "partials/messages.html" %}
    <div><label class="label" for="otp">Code</label><input id="otp" name="otp_token" class="field" inputmode="numeric" autocomplete="one-time-code" autofocus required maxlength="20"></div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-full justify-center" type="submit">Verify</button>
  </form>
  <form method="post" action="{% url 'accounts:logout' %}" class="mt-3 text-center">{% csrf_token %}<button class="text-sm text-slate-600 hover:underline" type="submit">Sign out</button></form>
</div>
{% endblock %}
