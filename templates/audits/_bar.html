<svg class="h-2 w-full overflow-hidden rounded-full" viewBox="0 0 100 2" preserveAspectRatio="none" role="img" aria-label="{{ s.compliant }} compliant, {{ s.partial }} partial, {{ s.non_compliant }} non-compliant, {{ s.not_applicable }} not applicable, {{ s.not_assessed }} not assessed"><rect width="100" height="2" class="fill-slate-200"/>{% for x, w, css in s.bar %}<rect x="{{ x }}" width="{{ w }}" height="2" class="{{ css }}"/>{% endfor %}</svg>
