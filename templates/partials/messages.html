{% if messages %}<div class="mb-4 space-y-2">{% for m in messages %}
<div class="rounded-md border px-4 py-2 text-sm {% if m.tags == 'error' %}border-red-200 bg-red-50 text-red-800{% elif m.tags == 'success' %}border-green-200 bg-green-50 text-green-800{% else %}border-slate-200 bg-white{% endif %}" role="status">{{ m }}</div>
{% endfor %}</div>{% endif %}
