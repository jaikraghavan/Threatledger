<div class="{{ class|default:'' }}">
  {% if field.field.widget.input_type == "checkbox" %}<label class="inline-flex items-center gap-2 text-sm text-slate-700">{{ field }} {{ field.label }}</label>
  {% else %}<label class="label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-red-600" aria-hidden="true">*</span>{% endif %}</label>{{ field }}{% endif %}
  {% if field.help_text %}<p class="mt-1 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
  {% for e in field.errors %}<p class="mt-1 text-sm text-red-700">{{ e }}</p>{% endfor %}
</div>
