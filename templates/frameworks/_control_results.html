{% if q %}<ul class="divide-y divide-slate-100 rounded-md border border-slate-200 text-sm" role="listbox" aria-label="Matching controls">{% for c in results %}<li class="flex items-center justify-between gap-3 px-3 py-2"><span><span class="font-mono text-xs text-slate-500">{{ c.ref }}</span> {{ c.name }}</span>
  <button class="btn btn-secondary px-2 py-1 text-xs" hx-post="{% url 'frameworks:requirement_map' req.framework.code req.pk %}" hx-vals='{"control": "{{ c.pk }}"}' hx-target="#req-panel" hx-swap="outerHTML">Map</button></li>{% empty %}<li class="px-3 py-2 text-slate-500">No matching controls.</li>{% endfor %}</ul>{% endif %}
