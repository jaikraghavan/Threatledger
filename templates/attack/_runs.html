<div {% if active_run %}hx-get="{% url 'attack:data' %}" hx-trigger="every 3s" hx-swap="outerHTML" hx-target="this"{% endif %} id="runs-inner">
<div class="mt-2 overflow-x-auto">
<table class="data-table">
  <thead><tr><th scope="col">#</th><th scope="col">Status</th><th scope="col">Requested</th><th scope="col">Result</th><th scope="col">When</th></tr></thead>
  <tbody class="divide-y divide-slate-100">
  {% for r in runs %}
  <tr>
    <td>{{ r.pk }}</td>
    <td><span class="badge {% if r.status == 'succeeded' %}bg-green-100 text-green-800{% elif r.status == 'failed' %}bg-red-100 text-red-800{% else %}bg-blue-100 text-blue-800{% endif %}">{{ r.get_status_display }}</span></td>
    <td class="text-xs">{{ r.requested_version|default:"latest" }}{% if r.requested_by %} · {{ r.requested_by }}{% endif %}</td>
    <td class="max-w-md text-xs text-slate-600">{{ r.message|default:"—" }}</td>
    <td class="whitespace-nowrap text-xs">{{ r.created_at|date:"Y-m-d H:i" }}</td>
  </tr>
  {% empty %}<tr><td colspan="5" class="py-6 text-center text-slate-500">No imports yet.</td></tr>{% endfor %}
  </tbody>
</table>
</div>
</div>
