{% if is_paginated %}
<nav class="mt-4 flex items-center gap-3 text-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="btn btn-secondary" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" hx-get="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" hx-target="{{ target }}" hx-push-url="true">Previous</a>{% endif %}
  <span class="text-slate-600">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn-secondary" href="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" hx-get="?{% if querystring %}{{ querystring }}&amp;{% endif %}page={{ page_obj.next_page_number }}" hx-target="{{ target }}" hx-push-url="true">Next</a>{% endif %}
</nav>
{% endif %}
