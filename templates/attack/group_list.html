{% extends "base.html" %}
{% block title %}Threat groups{% endblock %}
{% block content %}
<div class="mb-4"><h1 class="text-2xl font-semibold">Threat groups</h1><p class="text-sm text-slate-600">Adversary groups tracked by MITRE ATT&amp;CK, with the techniques they are known to use.</p></div>
<form class="card mb-4 p-4" role="search" hx-get="{% url 'attack:group_list' %}" hx-target="#group-table" hx-push-url="true" hx-trigger="input changed delay:250ms from:#g-q">
  <label class="label" for="g-q">Search by name, alias or ID</label>
  <input id="g-q" name="q" type="search" class="field max-w-md" value="{{ q }}" placeholder="APT29, Lazarus, G0016…" autocomplete="off">
</form>
<div id="group-table">{% include "attack/_group_table.html" %}</div>
{% endblock %}
