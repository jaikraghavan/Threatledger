{% if o.state == "filed" %}<span class="badge bg-green-100 text-green-800">filed{% if o.late %} late{% endif %}</span>{% elif o.state == "not_required" %}<span class="badge bg-slate-100 text-slate-700">not required</span>{% elif o.state == "overdue" %}<span class="badge bg-red-600 text-white">OVERDUE</span>{% elif o.state == "due_soon" %}<span class="badge bg-red-100 text-red-800">due {{ o.due_at|timeuntil }}</span>{% else %}<span class="badge bg-amber-100 text-amber-800">due in {{ o.due_at|timeuntil }}</span>{% endif %}
