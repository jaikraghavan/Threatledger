{% if q|length >= 2 %}<ul class="divide-y divide-slate-100 rounded-md border border-slate-200 text-sm" role="listbox" aria-label="Matching techniques">
{% for t in results %}<li class="flex items-center justify-between gap-3 px-3 py-2"><div><span class="font-mono text-xs text-slate-500">{{ t.attack_id }}</span> {% if t.parent %}<span class="text-slate-500">{{ t.parent.name }}:</span> {% endif %}{{ t.name }}</div>
  <button class="btn btn-secondary px-2 py-1 text-xs" hx-post="{% url 'risks:technique_add' risk.ref %}" hx-vals='{"technique": "{{ t.pk }}"}' hx-target="#risk-panels" hx-swap="outerHTML">Add</button></li>
{% empty %}<li class="px-3 py-2 text-slate-500">No matching active techniques.</li>{% endfor %}</ul>{% endif %}
